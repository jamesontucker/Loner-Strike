# Copies a published release of the app to Loner-Strike's download mirror (Cloudflare R2,
# dl.lonerstrike.com/app/), so updates and downloads don't depend on GitHub's downloads,
# which now and then fail for minutes at a time.
#
#   app/<tag>/<file>   the release's files (installers, update bundles, their signatures)
#   app/latest.json    the updater's file, pointing at the mirror's copies (the app asks
#                      for this first and GitHub's after it)
#
# Updates stay signed with the app's updater key and the app checks that signature, so a
# copy on the mirror can't be swapped for something else. Only the newest release writes
# latest.json; the 3 newest releases are kept and older ones deleted, after the new one is
# up and checked.
#
# Runs when a release is published (not a draft). By hand: Actions > Mirror release > Run
# workflow, with a tag (to copy one again).
#
# Secrets (Settings > Secrets and variables > Actions): R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_ENDPOINT, R2_BUCKET (an R2 token limited to that bucket).

name: Mirror release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to copy (like v0.1.3)"
        required: true

permissions:
  contents: read

concurrency:
  group: mirror-release
  cancel-in-progress: false

env:
  MIRROR: https://dl.lonerstrike.com
  KEEP: 3

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the release to the mirror
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG isn't a release tag like v0.1.3"; exit 1; }
          s3() { aws s3api --endpoint-url "$R2_ENDPOINT" "$@"; }

          # the release's files (GitHub's downloads can fail for a moment: a few tries)
          mkdir dist
          for i in 1 2 3 4 5; do
            gh release download "$TAG" -R "$REPO" -D dist --clobber && break
            [ "$i" = 5 ] && { echo "::error::Couldn't download the release's files."; exit 1; }
            sleep $((i * 10))
          done
          [ -f dist/latest.json ] || { echo "::error::The release has no latest.json (the updater's file)."; exit 1; }

          # up, then checked: each copy the size of the original
          for f in dist/*; do
            name=$(basename "$f")
            [ "$name" = latest.json ] && continue
            s3 put-object --bucket "$R2_BUCKET" --key "app/$TAG/$name" --body "$f" \
              --cache-control "public, max-age=31536000, immutable" >/dev/null
            size=$(s3 head-object --bucket "$R2_BUCKET" --key "app/$TAG/$name" --query ContentLength --output text)
            [ "$size" = "$(stat -c %s "$f")" ] || { echo "::error::$name didn't arrive whole on the mirror."; exit 1; }
            echo "copied $name"
          done

          # the updater's file, pointing at the mirror: only from the newest release (copying
          # an older one again mustn't offer it as an update)
          newest=$(gh release view -R "$REPO" --json tagName -q .tagName)
          if [ "$newest" = "$TAG" ]; then
            # each link becomes the mirror's copy of the same file: a download link names it,
            # an API one (a release that started as a draft) is looked up by its number
            cp dist/latest.json mirror-latest.json
            for platform in $(jq -r '.platforms | keys[]' dist/latest.json); do
              url=$(jq -r --arg p "$platform" '.platforms[$p].url' dist/latest.json)
              case "$url" in
                "https://github.com/$REPO/releases/download/$TAG/"*) name=${url##*/} ;;
                "https://api.github.com/repos/$REPO/releases/assets/"*) name=$(gh api "${url#https://api.github.com/}" -q .name) ;;
                *) echo "::error::latest.json links to $url, which isn't this release's"; exit 1 ;;
              esac
              jq --arg p "$platform" --arg u "$MIRROR/app/$TAG/$name" '.platforms[$p].url = $u' mirror-latest.json > next.json
              mv next.json mirror-latest.json
            done
            # every link must now be the mirror's, and every file it names there
            jq -r '.platforms[].url' mirror-latest.json | while read -r url; do
              case "$url" in "$MIRROR/app/$TAG/"*) ;; *) echo "::error::latest.json still links to $url"; exit 1 ;; esac
              s3 head-object --bucket "$R2_BUCKET" --key "app/$TAG/${url##*/}" >/dev/null
            done
            s3 put-object --bucket "$R2_BUCKET" --key app/latest.json --body mirror-latest.json \
              --content-type application/json --cache-control "public, max-age=60" >/dev/null
            echo "app/latest.json now offers $TAG"
          else
            echo "$TAG isn't the newest release ($newest): latest.json left as it is"
          fi

          # the newest $KEEP releases stay; older ones go
          versions=$(s3 list-objects-v2 --bucket "$R2_BUCKET" --prefix app/ --delimiter / \
            --query 'CommonPrefixes[].Prefix' --output text | tr '\t' '\n' | { grep -E '^app/v[0-9]+\.[0-9]+\.[0-9]+/$' || true; } | sed 's|^app/||; s|/$||' | sort -V)
          old=$(printf '%s\n' "$versions" | head -n -"$KEEP")
          for v in $old; do
            [ -n "$v" ] || continue
            [ "$v" = "$TAG" ] && continue
            echo "deleting $v"
            s3 list-objects-v2 --bucket "$R2_BUCKET" --prefix "app/$v/" --query 'Contents[].Key' --output text | tr '\t' '\n' \
              | { grep -v '^None$' || true; } | while read -r key; do s3 delete-object --bucket "$R2_BUCKET" --key "$key" >/dev/null; done
          done
          echo "kept: $(printf '%s\n' "$versions" | tail -n "$KEEP" | tr '\n' ' ')"
