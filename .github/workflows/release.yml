# Builds the Loner-Strike app for Mac (signed + notarized, Apple Silicon and Intel)
# and Windows, and attaches them to a draft GitHub release with the updater files.
#
# Release: push a tag like v0.1.0 (it must match "version" in app/src-tauri/tauri.conf.json),
# check the draft release on GitHub, then publish it. Published releases are what the
# in-app updater offers (releases/latest/download/latest.json).
# Test build without releasing: run this workflow by hand (Actions > Release > Run workflow).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      # Notarization reads the App Store Connect key from a file
      - name: Write the notarization key
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mac signing and notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # Signs the update files so the app only installs genuine updates
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: npx --yes @tauri-apps/cli@2
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Loner-Strike ${{ github.ref_name }}"
          releaseBody: "Download the file for your computer below. Mac: Loner-Strike.dmg. Windows: the -setup.exe."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # Manual runs don't make a release; keep the builds as downloadable artifacts instead
      - name: Keep the builds (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: loner-strike-${{ matrix.platform }}
          path: |
            app/src-tauri/target/**/bundle/dmg/*.dmg
            app/src-tauri/target/**/bundle/macos/*.app.tar.gz
            app/src-tauri/target/**/bundle/nsis/*.exe
            app/src-tauri/target/**/bundle/msi/*.msi
          if-no-files-found: warn
