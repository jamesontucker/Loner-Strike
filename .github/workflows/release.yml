# Builds the Loner-Strike app for Mac (signed + notarized, Apple Silicon and Intel)
# and Windows, and attaches them to a draft GitHub release with the updater files.
#
# Release: push a tag like v0.1.0 (it must match "version" in app/src-tauri/tauri.conf.json),
# check the draft release on GitHub, then publish it. Published releases are what the
# in-app updater offers: publishing also copies it to the download mirror
# (mirror-release.yml, dl.lonerstrike.com/app/latest.json, which the app asks first) and
# GitHub's releases/latest/download/latest.json is the fallback.
# Actions are pinned to exact commits (this job holds the signing keys); Dependabot
# proposes updates. Test build without releasing: run this workflow by hand (Actions > Release > Run workflow).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ls-control, the shared control service the app puts on a Linux server over SSH: one
  # static Linux x86_64 program, built in Docker from app/server-agent (its own job, with
  # read-only access and no secrets; the app builds below take it as an artifact)
  server-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build ls-control (static Linux x86_64, in Docker)
        run: ./scripts/build-server-agent.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ls-control
          path: |
            app/src-tauri/resources/linux/ls-control/ls-control
            app/src-tauri/resources/linux/ls-control/ls-control.sha256
          if-no-files-found: error
          retention-days: 7

  build:
    needs: server-agent
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # a tag must match the app's version, or the updater would offer the wrong thing
      - name: Check the tag matches the app's version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "$want" != "$have" ]; then
            echo "::error::The tag is v$want but the app is version $have. Run ./scripts/bump-version.sh $want and tag again."
            exit 1
          fi

      # the version's own section of CHANGELOG.md becomes the release's notes, which the
      # updater's latest.json carries (the app shows them before and after an update);
      # a release without a section fails, so every update says what's in it
      - name: Release notes from the changelog
        id: notes
        shell: bash
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          section=$(awk -v v="## $version" '$0 == v {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md | sed -e '/./,$!d')
          if [ -z "$section" ]; then
            if [ "${{ github.ref_type }}" = tag ]; then
              echo "::error::CHANGELOG.md has no '## $version' section: write what's new before tagging."
              exit 1
            fi
            section="(no notes yet)"
          fi
          {
            echo "body<<LS_NOTES_END"
            echo "$section"
            echo ""
            echo "---"
            echo "Download the file for your computer below. Mac: the .dmg. Windows: the -setup.exe. Windows may say it protected your PC (SmartScreen): click More info, then Run anyway."
            echo ""
            echo "Found a bug? In the app, open Settings and click Copy next to Copy diagnostics, then post it on Discord (https://discord.gg/K9eBHVVwZE) or in Issues."
            echo "LS_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      # ls-control goes in the app's resources (linux/ls-control), checked against the
      # sha256 written when it was built; the app checks it again before sending it to a server
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ls-control
          path: app/src-tauri/resources/linux/ls-control

      - name: Check ls-control
        shell: bash
        run: |
          cd app/src-tauri/resources/linux/ls-control
          if command -v sha256sum >/dev/null; then sha256sum -c ls-control.sha256; else shasum -a 256 -c ls-control.sha256; fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri -> target

      # playit.gg's agent (BSD-2-Clause), shipped inside the app for "Play with friends".
      # playit publishes no Mac build, so it's built from their v1.2.0 source for both Macs;
      # Windows gets their own signed build, checked against its sha256.
      - name: Build playit's agent (Mac)
        if: matrix.platform == 'macos-latest'
        run: |
          git clone --depth 1 --branch v1.2.0 https://github.com/playit-cloud/playit-agent "$RUNNER_TEMP/playit"
          cd "$RUNNER_TEMP/playit"
          test "$(git rev-parse HEAD)" = 7acf13568a99707dda73028234fdb376e45b15da
          cargo build --release --locked -p playitd --target aarch64-apple-darwin
          cargo build --release --locked -p playitd --target x86_64-apple-darwin
          mkdir -p "$GITHUB_WORKSPACE/app/src-tauri/binaries"
          # each half of the universal build looks for its own copy, then the bundle takes the combined one
          B="$GITHUB_WORKSPACE/app/src-tauri/binaries"
          cp target/aarch64-apple-darwin/release/playitd "$B/playitd-aarch64-apple-darwin"
          cp target/x86_64-apple-darwin/release/playitd "$B/playitd-x86_64-apple-darwin"
          lipo -create "$B/playitd-aarch64-apple-darwin" "$B/playitd-x86_64-apple-darwin" -output "$B/playitd-universal-apple-darwin"

      - name: Get playit's agent (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p app/src-tauri/binaries
          curl -fsSL -o app/src-tauri/binaries/playitd-x86_64-pc-windows-msvc.exe \
            https://github.com/playit-cloud/playit-agent/releases/download/v1.2.0/playitd-windows-x86_64-signed.exe
          echo "e8dff30a9269a10d2c6786c95a0618567772e441d07dd7ebe3c1a37d3f35534d  app/src-tauri/binaries/playitd-x86_64-pc-windows-msvc.exe" | sha256sum -c -

      # ls-voice (app/voice-agent): Advanced Bot Interaction's speech-to-text helper, shipped
      # inside the app like playit's agent; it does nothing until a server turns voice on.
      # Whisper and Opus are built into it (cmake), so it needs nothing installed
      - name: Build ls-voice (Mac)
        if: matrix.platform == 'macos-latest'
        run: |
          cd app/voice-agent
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          B="$GITHUB_WORKSPACE/app/src-tauri/binaries"
          mkdir -p "$B"
          cp target/aarch64-apple-darwin/release/ls-voice "$B/ls-voice-aarch64-apple-darwin"
          cp target/x86_64-apple-darwin/release/ls-voice "$B/ls-voice-x86_64-apple-darwin"
          lipo -create "$B/ls-voice-aarch64-apple-darwin" "$B/ls-voice-x86_64-apple-darwin" -output "$B/ls-voice-universal-apple-darwin"

      - name: Build ls-voice (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cd app/voice-agent
          cargo build --release --locked
          mkdir -p ../src-tauri/binaries
          cp target/release/ls-voice.exe ../src-tauri/binaries/ls-voice-x86_64-pc-windows-msvc.exe

      # Notarization reads the App Store Connect key from a file
      - name: Write the notarization key
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mac signing and notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # Signs the update files so the app only installs genuine updates
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: npx --yes @tauri-apps/cli@2.12.4
          # playitd goes next to the app's own program (and is signed with it on a Mac)
          args: >-
            ${{ matrix.args }} --config '{"bundle":{"externalBin":["binaries/playitd","binaries/ls-voice"]}}'
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Loner-Strike ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # (named includeUpdaterJson before tauri-action 1.0: the old name is ignored
          # without an error, and the app would stop getting updates)
          uploadUpdaterJson: true

      # Manual runs don't make a release; keep the builds as downloadable artifacts instead
      - name: Keep the builds (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loner-strike-${{ matrix.platform }}
          path: |
            app/src-tauri/target/**/bundle/dmg/*.dmg
            app/src-tauri/target/**/bundle/macos/*.app.tar.gz
            app/src-tauri/target/**/bundle/nsis/*.exe
            app/src-tauri/target/**/bundle/msi/*.msi
          if-no-files-found: warn
