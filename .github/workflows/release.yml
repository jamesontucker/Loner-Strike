# Builds the Loner-Strike app for Mac (signed + notarized, Apple Silicon and Intel)
# and Windows, and attaches them to a draft GitHub release with the updater files.
#
# Release: push a tag like v0.1.0 (it must match "version" in app/src-tauri/tauri.conf.json),
# check the draft release on GitHub, then publish it. Published releases are what the
# in-app updater offers (releases/latest/download/latest.json).
# Actions are pinned to exact commits (this job holds the signing keys); Dependabot
# proposes updates. Test build without releasing: run this workflow by hand (Actions > Release > Run workflow).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri -> target

      # playit.gg's agent (BSD-2-Clause), shipped inside the app for "Play with friends".
      # playit publishes no Mac build, so it's built from their v1.2.0 source for both Macs;
      # Windows gets their own signed build, checked against its sha256.
      - name: Build playit's agent (Mac)
        if: matrix.platform == 'macos-latest'
        run: |
          git clone --depth 1 --branch v1.2.0 https://github.com/playit-cloud/playit-agent "$RUNNER_TEMP/playit"
          cd "$RUNNER_TEMP/playit"
          test "$(git rev-parse HEAD)" = 7acf13568a99707dda73028234fdb376e45b15da
          cargo build --release --locked -p playitd --target aarch64-apple-darwin
          cargo build --release --locked -p playitd --target x86_64-apple-darwin
          mkdir -p "$GITHUB_WORKSPACE/app/src-tauri/binaries"
          lipo -create target/aarch64-apple-darwin/release/playitd target/x86_64-apple-darwin/release/playitd \
            -output "$GITHUB_WORKSPACE/app/src-tauri/binaries/playitd-universal-apple-darwin"

      - name: Get playit's agent (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p app/src-tauri/binaries
          curl -fsSL -o app/src-tauri/binaries/playitd-x86_64-pc-windows-msvc.exe \
            https://github.com/playit-cloud/playit-agent/releases/download/v1.2.0/playitd-windows-x86_64-signed.exe
          echo "e8dff30a9269a10d2c6786c95a0618567772e441d07dd7ebe3c1a37d3f35534d  app/src-tauri/binaries/playitd-x86_64-pc-windows-msvc.exe" | sha256sum -c -

      # Notarization reads the App Store Connect key from a file
      - name: Write the notarization key
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mac signing and notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # Signs the update files so the app only installs genuine updates
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: npx --yes @tauri-apps/cli@2.12.4
          # playitd goes next to the app's own program (and is signed with it on a Mac)
          args: >-
            ${{ matrix.args }} --config '{"bundle":{"externalBin":["binaries/playitd"]}}'
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Loner-Strike ${{ github.ref_name }}"
          releaseBody: "Download the file for your computer below. Mac: the .dmg. Windows: the -setup.exe."
          releaseDraft: true
          prerelease: false
          # (named includeUpdaterJson before tauri-action 1.0: the old name is ignored
          # without an error, and the app would stop getting updates)
          uploadUpdaterJson: true

      # Manual runs don't make a release; keep the builds as downloadable artifacts instead
      - name: Keep the builds (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loner-strike-${{ matrix.platform }}
          path: |
            app/src-tauri/target/**/bundle/dmg/*.dmg
            app/src-tauri/target/**/bundle/macos/*.app.tar.gz
            app/src-tauri/target/**/bundle/nsis/*.exe
            app/src-tauri/target/**/bundle/msi/*.msi
          if-no-files-found: warn
