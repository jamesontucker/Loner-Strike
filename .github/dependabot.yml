version: 2
updates:
  # Keeps the pinned action commits in the release workflow up to date: one pull
  # request a month with all of them. Check a test build (Actions > Release > Run
  # workflow) before merging a major version.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
