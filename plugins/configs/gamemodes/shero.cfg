// SuperHero Mod (superheromodnvault.amxx + 40 heroes). Full config: configs/shero/shconfig.cfg,
// levels/XP table: configs/shero/superhero.ini, bot behaviour: configs/shero/shbots.ini.
// XP is saved in addons/amxmodx/data/vault/superhero.vault (bots are saved by name).
// say /help, /showmenu, /herolist, /myheroes, /drop <hero>; bind keys to +power1 +power2 +power3.
mp_freezetime 3
// 1 = save XP between maps (long-term XP table), 0 = everyone restarts each map
sh_savexp 1
// level new players start at (1 = one hero right away)
sh_minlevel 1
// max heroes per player (also limited by level)
sh_maxpowers 10
// max heroes with a +power key per player
sh_maxbinds 3
// 1 = bots press their +power keys (see shbots.ini), 0 = bots only get passive effects
sh_bot_powers 1
// min seconds between two presses of the same power key by a bot
sh_bot_powerdelay 3
