; What happens in play, written per person and per moment (docs/bot-chat-style.md,
; docs/bot-people.md). Merged with botchat.ini: these sections add to the ones there.
;
; The point: lines that are only true for some people at some moments, so twenty bots
; don't sound alike. Plain reactions anyone says first, then trait and situation lines.
; {other} is the one it's about: the victim in kill_*, the killer in death_*, the hot
; player in enemy_streak, the teammate in nice_shot / support / spectating.

