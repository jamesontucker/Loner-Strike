; Game mode components for de_dust2, for modes that load gm_components (docs/COMPONENTS.md).
; One per line: classname x y z key=value ...  (z can be a little above the floor; components find it)
; Your own copy goes in addons/amxmodx/configs/components/de_dust2.ini (loaded after this one).
; de_dust2.<mode>.ini beside it is only loaded in that mode.
; Make more in game: ls_comp_spawn <classname> key=value ... where you aim, then ls_comp_save.

; Two capture points on the bomb sites
ls_capture_point 1152 2464 120 name=A radius=200 capture_secs=10
ls_capture_point -1536 2688 40 name=B radius=200 capture_secs=10

; A weapon on the floor in each spawn, and a crate (between the spawn points)
ls_weapon_spawner -880 -848 180 item=table:default tier=2 respawn_secs=30
ls_weapon_spawner 304 2176 -80 item=table:default tier=2 respawn_secs=30
ls_loot_container -976 -848 180 table=default tier=2 items=2
ls_loot_container 208 2176 -80 table=default tier=2 items=2

; A supply drop falls on A one minute in
ls_supply_drop 1152 2464 120 at=60 chance=100 fall_secs=15

