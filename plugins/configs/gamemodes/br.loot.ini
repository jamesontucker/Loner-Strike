; Battle Royale's loot tables (gm_components reads these after loot.ini; a table here replaces the one
; with the same name). Same format: [table], then "item  weight  tier" (a tier-N crate only gives items
; up to tier N; an item's tier is also its rarity glow: 1 white, 2 green, 3 blue, 4 purple, 5 gold).
;
; Battle Royale's own items (gm_components, docs/COMPONENTS.md "Battle Royale pieces"):
;   bandage, bandage:2, medkit, drink      healing items, carried (F or say /heal to use)
;   vest1..vest3, helmet1..helmet3         armor levels
;   ammo                                   two magazines for each gun carried (ammo is scarce: a gun
;                                          found comes with one magazine and one spare)
;   ammo:9mm, ammo:556, ammo:762, ...      one calibre, two magazines' worth

