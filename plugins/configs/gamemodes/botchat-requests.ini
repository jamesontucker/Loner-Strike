; Questions with real answers, and requests (gm_botchat.amxx merges every botchat*.ini; the
; conditions are the same as in botchat.ini, see the comments there).
;
; r_money, r_gun, r_hp, r_left, r_where, r_whereme, r_bomb_*: a teammate answering a person
; ("money?", "what gun u got", "hp?", "how many left", "where'd he go", "where u at", "wheres
; the bomb") with the real thing: {money} "4350" / "16k", {gun} "ak" / "m4 and deag", {hp},
; {left}, {place} where it was ("long", "b"), {ago} "just now" / "15 sec ago".
; r_req_*: asked to do something ("cover me", "wait", "go b", "come here", "spray that wall",
; "jump", "crouch"): what it says when it does it, won't, can't or is busy. {site} is where
; it's going ("b", "mid", "there"). r_kys_*: someone typed "kys".
; Answers are short: people answer a question in team chat with the number and little else.

