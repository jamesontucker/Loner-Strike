; The social side of the pub (gm_botchat.amxx reads every botchat-*.ini after botchat.ini;
; sections here add to the same sections there). How to write: docs/bot-chat-style.md.
;
; Coming and going, memory of people, off-topic chatter when dead or in freeze time, map and
; mode votes, clans, sprays, bhops and votekicks. The memory lines (rel fam days rival) start
; working once gm_people remembers people; until then they are simply never picked.
; Off-topic is about 1% of real chat, so hobby lines are kept rare with !odds and !cd.
; {hobby} is one of the bot's two hobbies at random, so it only goes in lines any hobby fits.

