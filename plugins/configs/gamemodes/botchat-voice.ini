; What bots say about people talking on voice (gm_botchat, from Loner-Strike's engine on
; dedicated servers). {other} is the one who was talking. Only someone who could hear them
; answers: a teammate, or anyone with sv_alltalk 1. Mostly nobody reacts at all.

