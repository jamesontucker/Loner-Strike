// Battle Royale (gm_battleroyale.amxx + gm_components.amxx): everyone for themselves (or squads),
// spread-out spawns with only a knife, loot, a closing zone, last one (or squad) standing wins.
// One round is one game: the mode ends it.
mp_freeforall 1
mp_round_infinite 1
// spawn on the spots the game spreads over the nav, not the map's spawn entities (br_valley stacks
// most of them in one place: a new game spawned everyone at once there and only ~4 lived)
mp_randomspawn 1
mp_roundtime 9
mp_freezetime 3
mp_buytime 0
mp_startmoney 800
mp_autoteambalance 0
mp_limitteams 0
mp_forcerespawn 0
mp_forcecamera 0
mp_timelimit 0
mp_weapons_allow_map_placed 1
humans_join_team any
gm_nobomb 1
bot_deathmatch 1
// spawn at the map's respawn points, as far from everyone else as possible
ls_comp_spawn_far 1
//   br_squad        1 solo, 2 duos, 4 squads (squad mates can't hurt each other; bots treat them as friends)
//   br_start        what everyone starts with ("knife", "knife glock18", ...)
//   br_drop         seconds nobody can hurt anyone at the start (loot up)
//   br_zone_start   seconds of fighting before the zone starts closing (the round clock counts down each stage)
//   br_drops        supply drops per game
//   br_wait_human   1: bots alone don't play a game; one starts when a person joins
// Times are for 24 players: fewer make a quicker game (zone delay, zone stages and drops x players/24,
// down to half; loot-up a little shorter), 32 a little longer. Bots' habits come from their people.ini
// playstyle: rushers/knifers/ninjas hunt, roamers/naders/objective players loot, careful/campers/AWPers/lurkers camp.
br_squad 1
br_start knife
br_drop 15
br_zone_start 30
br_drops 3
br_wait_human 1
//   br_dropin       1: start high over the map and fall slowly (steer to where you want to land)
//   br_drop_height  how high above the landing spot at most (the map's sky is the real limit)
br_dropin 1
br_drop_height 3000
