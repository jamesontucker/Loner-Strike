// Team deathmatch (gm_deathmatch.amxx). say /guns re-opens the gun menu.
gmdm_respawn_delay 1.5
gmdm_protect 2
gmdm_random_spawns 1
gmdm_grenade 1
mp_freezetime 0
mp_roundtime 9
// (no round end mid-game: a 9-minute round would end it as a draw, everyone respawning at once)
mp_round_infinite 1
// bots just hunt: no bomb or hostage goals (ReGameDLL)
bot_deathmatch 1
