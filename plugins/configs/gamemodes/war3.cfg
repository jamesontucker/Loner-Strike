// Warcraft 3: Frozen Throne (war3ft.amxx). Full config: configs/war3ft/war3FT.cfg
// XP is saved to addons/amxmodx/data/sqlite3/war3ft.sq3 (wc3_save_xp is set in war3FT.cfg,
// because it must be set before the database opens). Bots are saved by name.
// say /war3menu, /changerace, /shopmenu, /shopmenu2, /selectskill; bind a key to "ultimate".
mp_freezetime 4
// lower = faster leveling (1.0 = upstream; level 10 then needs 51200 XP)
wc3_xp_multiplier 0.25
// level a brand-new race starts at
wc3_start_level 2
// 8 standard races; 9 adds the Chameleon (random skills)
wc3_races 8
// chance a bot buys a shop item each round
wc3_bot_buy_item 0.33
wc3_ult_cooldown 35.0
wc3_show_kill_obj 1
