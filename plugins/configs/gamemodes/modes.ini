; Game modes shown in the in-game menu (say /gm, or the "gamemenu" command).
;
; id  "Menu name"  "Short description"  "Mode options command"  "flags"
;   flags: w = the Fun menu's "Weapons" preset is available in this mode
;          g = GunGame settings (weapon order), z = Zombie Plague settings (special rounds)
;
; Each mode loads the plugins listed in <id>.plugins.ini and runs <id>.cfg
; (after base.cfg). Optional: maps/<id>.txt limits the map list for that mode.
; To add a mode: drop its plugins in plugins/, add a line here, and create those files.

classic       "Classic"           "Bomb defusal & hostage rescue"  ""              "w"
csdm          "Deathmatch"        "Teams, instant respawn, pick your guns"  "say /guns"     ""
csdm_ffa      "Free for all"      "Everyone for themselves, instant respawn"  "say /guns"  ""
gungame       "Gun Game"          "Kill to level through guns"     ""              "g"
gungame_team  "Gun Game (Teams)"  "Teams share a level"            ""              "g"
zombie        "Zombie Plague"     "Survive the infection"          "say /zpmenu"   "z"
match         "Match (5v5)"       "Scrims: /ready, knife round, MR15, half-time swap"  "say /match"  ""
knife         "Knife Arena"       "Knives only"                    ""              "w"
pistols       "Pistols Only"      "No primaries"                   ""              "w"
deagle        "Deagle Only"       "Free deagle every spawn"        ""              "w"
awp           "AWP Only"          "Free AWP every spawn"           ""              "w"
scoutz        "Scoutz & Knivez"   "Scouts, low gravity, air control"         ""              "w"
surf          "Surf"              "Air control, free guns, long rounds"  ""          "w"
war3          "Warcraft 3"        "Races, skills, items & ultimates; XP is saved"  "say /war3menu"  ""
hns           "Hide and Seek"     "Ts hide, CTs seek with knives"          "say /hnshelp"  ""
paintball     "Paintball"         "One hit out, back when your killer is"   "say /pbgun"    ""
kreedz        "Kreedz (climb)"    "Solo climbing: timer, checkpoints, top 15"  "say /menu"  ""
deathrun      "Deathrun"          "One trap activator, everyone else runs the course"  ""  ""
basebuilder   "Base Builder"      "Build a base, survive the zombies"  "chooseteam"  ""
soccerjam     "SoccerJam"         "Knife football: kick the ball into the enemy goal"  "say help"  ""
zp5           "Zombie Plague Advanced"  "Sniper, Assassin, Nemesis, Survivor & more"  "say /zpmenu"  ""
shero         "SuperHero"         "Level up and pick superheroes; XP is saved"  "say /showmenu"  ""
