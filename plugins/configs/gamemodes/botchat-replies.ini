; More answers: how bots answer people and each other (gm_botchat.amxx merges every
; botchat*.ini; the sections are the same as in botchat.ini, see the comments there).
;
; r_* is an answer: to a person's line classified as that topic, or to a bot that asked
; with >tag. t_* is a bot carrying on a thread with a person who answered it. {other} is
; the one being answered (the person, or the bot that asked).
;
; Who answers matters more than what was said: the same "hacker" gets "lol thx" from a
; show-off, "just lucky" from a humble one, "ur just bad" from a tilty one and a shrug
; from an old-timer. Lines on rel / fam / days / rival wait for gm_people's memory (stage 3)
; and are skipped until then. Answers about yourself stay vague: nothing that could
; contradict itself next week.

