; What bots say (gm_botchat.amxx). Edit freely; "gm_botchat_reload" re-reads this file.
;
; [section] is what happened. Each line:  personalities|text
; Personalities (codes are case sensitive, f and F are different people; digits count too):
;   f friendly    t tryhard     s salty      j joker        q quiet (says little)
;   n new player  c chill       o old-timer  k kid          x not their first language
;   h hype        z zoomer      p streamer wannabe          b backseat gamer
;   i the team's caller         d half asleep               u blames themselves
;   w wholesome   r military roleplay        m meme lord
;   A anime fan   B brit        C conspiracy theorist       D dad gamer
;   E esports wannabe           F foodie     G grammar nerd H sees hackers everywhere
;   L lurker (hardly talks)     M music guy  N stats nerd   O overconfident
;   P pacifist, knife only      S movement nerd (bhop, kz)  T map tourist
;   Y yapper (long lines about their day)   I IT guy       J gym bro
;   K "where is the admin"      Q trivia guy R patient coach             U pirate
;   V villain roleplay          W philosopher               X xtreme 2000s gamer
;   Z zen monk    0 self-aware bot joke      1 cowboy       2 detective
;   3 leetspeak
;   * anyone. Any mix of codes works (up to 15 of them, use * for more).
; {name} the bot, {other} who it's about or answering, {map} the map,
; {tag} the bot's clan tag without brackets (for the clan sections).
; A line starting with @ goes to team chat.
; End a line with  >tag  to ask for an answer from [r_tag] (from the one it's about, if a bot).
;   So no other > in a line. A reply may ask for a reply too, three deep at most.
; Plain ascii only, no | in the text, about 100 characters at most.
; Bots also vary lines as they type: lowercase, typos, stretched letters, their own laugh
; for "lol"/"haha", text-speak, a word they keep using, an emoticon. So write lines plain.
; A section may appear more than once, the lines are merged.
; Sections marked "not triggered yet" were written ahead; all of them are used now except [wallbang].

