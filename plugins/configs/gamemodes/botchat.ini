; What bots say (gm_botchat.amxx). Edit freely; "gm_botchat_reload" re-reads this file.
;
; Write it like a 2004 pub: short, lowercase, mostly reactions ("nt", "ns", "lol", "rush b").
; Real people mostly don't chat, so lines are picked rarely; a few plain lines beat a lot of
; clever ones. Avoid jokes that sound written, all caps, and lines about the same thing.
;
; [section] is what happened. Each line:  personalities|text
;   * anyone. Most lines should be *.
;   Letters mark lines only some personalities say. They come up more or less often with
;   gm_personality (0 = never, 100 = normal, 200 = twice as often):
;   f friendly    t tryhard     s salty      j joker        q quiet (says little)
;   n new player  c chill       o old-timer  k kid          x not their first language
;   b backseat gamer            i the team's caller         d half asleep
;   u blames themselves         B brit       D dad gamer    H sees hackers everywhere
;   L lurker      O overconfident            S movement nerd
;   (the plugin knows a few more letters; any mix of codes works, up to 15 of them)
; {name} the bot, {other} who it's about or answering, {map} the map,
; {tag} the bot's clan tag without brackets (for the clan sections).
; A line starting with @ goes to team chat.
; End a line with  >tag  to ask for an answer from [r_tag] (from the one it's about, if a bot).
;   So no other > in a line. A reply may ask for a reply too, three deep at most.
; Plain ascii only, no | in the text, about 100 characters at most.
; Bots vary lines as they type: lowercase, typos, their own laugh for "lol"/"haha",
; text-speak, now and then a word they keep using or an emoticon. So write lines plain.
; The same line isn't said twice in a while (lines of 6 characters or less can be), and a
; theme (noscope, lag, hackers, sleep, the map, gear, camping, the old days) rests for a
; few minutes after someone brings it up.
; A section may appear more than once, the lines are merged.

