; Loot tables for game mode components (gm_components): weapon spawners with item=table:<name>,
; loot crates and supply drops. A mode's own <mode>.loot.ini beside this file replaces tables
; with the same name.
;
; [table name]
; item        weight   tier (1 common .. 5 best; a tier-2 crate only gives tier 1-2 items)
;
; Items: any weapon (ak47, m4a1, awp, deagle, mp5navy ...), vest, vesthelm, he, flash, smoke,
; nvg, defuse, ammo (fills every gun), hp:<amount>, armor:<amount>, money:<amount>.

