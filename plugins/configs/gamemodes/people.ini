; Who the bots are (gm_people.amxx; docs/bot-people.md). Edit freely; the map change re-reads it.
;
; Every bot is someone: an archetype (below) fixes a few of its traits, the rest are rolled,
; all from its name, so a regular is the same person every time it shows up.
;
; Traits and their values (a number works too, counting from 0):
;   warmth  cold neutral warm            ego    humble normal showoff
;   temper  chill normal tilty           talk   silent quiet normal chatty spammer
;   humor   none dry goofy troll         age    kid teen adult old
;   skill   newbie average good pro      role   regular drifter admin clan afk
;   region  us uk de se pl ru br fr nl es au fi dk
;   style   rusher roamer lurker careful camper awper knifer nader ninja objective weirdgun
;   hobby   wc3 wow halo school work cars music lan cz source awp sleep food girlfriend footy metal
;
; [archetypes]  name|weight|letter|style|fixed traits
;   weight: how common (per thousand or so); letter: the old personality letter it acts as
;   (gm_botchat, gm_humanbots, gm_botfun read it); style: how it plays ("-" rolls one);
;   fixed traits: trait=value, a few at most (hobby=x fixes one of its two hobbies)
; [conflicts]  trait=value trait=value: never both (a non-fixed one is rolled again)
; [weights]  trait|weights for its values when rolled (most people sit in the middle)

