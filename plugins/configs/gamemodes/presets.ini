; One-click setups: a mode, settings, bot count and (optionally) a map.
; Applying a preset resets that mode's saved settings first, then applies these.
; Settings you save yourself from the menu go to data/gamemodes/presets_user.ini.
;
; id  "Name"  "Description"  "mode"  "map (blank = current)"  "bots (blank = keep)"  "cvar=value ..."

competitive  "Competitive 5v5"  "Expert bots, $800 starts, short rounds"  "classic"  ""  "9"   "bot_difficulty=3 mp_startmoney=800 mp_roundtime=1.75 mp_freezetime=6 mp_buytime=0.25 mp_friendlyfire=1 mp_maxrounds=30 mp_c4timer=35 gm_autobhop=0 gm_tracers=0 gm_dmgnumbers=0"
arcade       "Arcade chaos"     "Deathmatch, lasers, damage numbers, bunnyhop"  "csdm"  ""  "19"  "bot_difficulty=2 gm_infammo=1 gm_autobhop=1 gm_tracers=2 gm_dmgnumbers=1"
sniperduel   "Sniper duel"      "AWPs, headshots only, three expert bots"  "awp"  ""  "3"   "bot_difficulty=3 gm_hsonly=1 gm_tracers=1 gm_dmgnumbers=1"
moonknife    "Moon knife fight" "Knives, scoutzknivez gravity, bunnyhop"  "knife"  ""  "9"   "bot_difficulty=1 sv_gravity=210 sv_airaccelerate=100 gm_autobhop=1"
zombienight  "Zombie night"     "Zombie Plague in the dark, a full server"  "zombie"  ""  "15"  "bot_difficulty=2 zp_lighting=d"
surf         "Surf session"     "surf_ski_2 with air control and free guns"  "surf"  "surf_ski_2"  "0"  "gm_autobhop=0"
