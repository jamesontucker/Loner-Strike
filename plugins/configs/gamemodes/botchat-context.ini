; Lines for the moment: the mode, the map, the round, who it's talking to, the era, how people
; play (gm_botchat.amxx merges every botchat*.ini; conditions as in botchat.ini).
;
; mode=<mode id> (a prefix: mode=csdm is both deathmatches, mode=gungame both Gun Games),
; round=pistol|eco|force|full|last, enemies<n>, clanmate=1, and gm_people's rel / fam /
; rival / lop. Sections new here:
;   freeze_round   freeze time, about the round coming (a pistol round, an eco, the last one)
;   smalltalk      freeze time and the dead: the rest of life in 2004 (wc3, msn, lan, school)
;   halftime, overtime   a match changing sides, or going to overtime
;   teamflash      a teammate's flash just blinded it ({other} threw it)
;   human_awp, human_camping, human_rush, human_bhop, human_topfrag, human_lag   a person
;                  awping a lot, killing from where they've sat for a while, two kills in the
;                  first seconds, bunnyhopping, well ahead on the scoreboard, a bad ping
;   r_spam         someone typing line after line

