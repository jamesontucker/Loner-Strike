; Game modes players can vote for: rock the vote (rtv, rtm) and the mode vote at map end.
; One mode id per line, from modes.ini. Modes that aren't installed are skipped, and so
; is a mode with no map that suits it (its map list, map presets, or map names like
; deathrun_ or bb_). zp5 shows in the vote as "Zombie Plague".
;
; The app's Rules page edits this list for each game or server: it saves its own copy in
; data/gamemodes/votemodes.ini, which is used instead of this file.

