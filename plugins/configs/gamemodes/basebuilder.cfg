// Base Builder manages teams itself (teams swap every round). Its own settings: configs/basebuilder.cfg
mp_autoteambalance 0
mp_limitteams 0
mp_freezetime 0
// round must outlast build + prep + game time (90 + 20 + 230 s)
mp_roundtime 6
mp_buytime 0
mp_startmoney 800
mp_falldamage 0
mp_weapons_allow_map_placed 0
gm_nobomb 1
bot_allow_rogues 0
bb_build_time 90
bb_prep_time 20
bb_game_time 230
bb_bot_zombie_classes 3
bb_bot_weapon_min 6
bb_bot_weapon_max 14
// base.cfg puts sv_maxspeed back to 320, which would hold the faster zombie classes back
sv_maxspeed 9999
