// Free-for-all deathmatch: no teams, everyone (bots too) fights everyone.
// mp_freeforall needs ReGameDLL (czero/dlls/mp.dll); the original game ignores it.
mp_freeforall 1
gmdm_respawn_delay 1.5
gmdm_protect 2
gmdm_random_spawns 1
gmdm_grenade 1
mp_freezetime 0
mp_roundtime 9
// (no round end mid-game: a 9-minute round would end it as a draw, everyone respawning at once)
mp_round_infinite 1
mp_autoteambalance 0
mp_limitteams 0
// bots just hunt: no bomb or hostage goals (ReGameDLL)
bot_deathmatch 1
