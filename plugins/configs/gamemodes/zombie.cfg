// Zombie Plague manages teams itself. Its own settings: configs/zombieplague.cfg
mp_autoteambalance 0
mp_limitteams 0
mp_freezetime 3

// base.cfg runs after the mode's plugins have set these at map start, so set them again:
// without sv_maxspeed 9999 the faster zombies are held to 320
sv_maxspeed 9999
mp_flashlight 1
mp_playerid 1
// a plugin steers the bots here: Loner-Strike's bot brain keeps out of it
bot_ls_fight 0
bot_ls_solo 0
