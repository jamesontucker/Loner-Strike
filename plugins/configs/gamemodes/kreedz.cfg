// Kreedz: solo climbing with a timer, checkpoints and local Top 15 records.
// Say /menu (or /kz). Press the map's start button to start the timer.
// Bots are kept out by kz_gm_nobots.amxx (the saved bot count would otherwise
// be applied after this file); bot_quota 0 here is only a fallback.
bot_quota 0
mp_timelimit 0
mp_roundtime 9
mp_round_infinite 1
mp_freezetime 0
mp_buytime 0.25
mp_autoteambalance 0
mp_limitteams 0
mp_falldamage 1
mp_weapons_allow_map_placed 0
sv_airaccelerate 10
sv_gravity 800
kz_checkpoints 1
kz_pause 1
kz_show_timer 2
kz_hook_prize 1
kz_semiclip 1
kz_respawn_ct 1
// a plugin steers the bots here: Loner-Strike's bot brain keeps out of it
bot_ls_fight 0
bot_ls_solo 0
