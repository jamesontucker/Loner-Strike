// Executed before every mode's cfg, so leftovers from the previous mode are reset.
// These are the game's defaults. Change settings from the in-game menu instead -
// those are saved per mode in addons/amxmodx/data/gamemodes/.
gm_weapons 0
gm_bot_weapons 0
gm_infammo 0
gm_hsonly 0
sv_gravity 800
sv_airaccelerate 10
mp_roundtime 5
mp_freezetime 6
mp_buytime 1.5
mp_startmoney 800
mp_friendlyfire 0
mp_timelimit 20
mp_maxrounds 0
mp_winlimit 0
mp_c4timer 45
mp_autoteambalance 1
mp_limitteams 2
// new players start with hard bots and normal bot chat (saved choices come after this)
bot_difficulty 2
gm_botchat 2
bot_stop 0
gm_autorespawn 0
gm_infmoney 0
bot_zombie 0
mp_freeforall 0
bot_allow_pistols 1
bot_allow_shotguns 1
bot_allow_sub_machine_guns 1
bot_allow_rifles 1
bot_allow_machine_guns 1
bot_allow_snipers 1
bot_allow_grenades 1
bot_allow_shield 1
gm_nobomb 0
bot_defer_to_human 0
bot_walk 0
bot_allow_rogues 1
// bots only do bomb and hostage goals where a mode wants them (deathmatch modes set 1)
bot_deathmatch 0
// an organised match: bots play disciplined (match mode sets 1)
bot_ls_match 0
// Loner-Strike's bot brain on (steered modes turn the fight parts off; gamemodes.amxx also
// turns it all off for the Original bot style)
bot_ls_fight 1
// (Surf turns this on: the brain steers surf bots)
bot_ls_surf 0
bot_ls_solo 1
// the bots' voice lines: only the important ones (Bots > Bot chatter changes it)
bot_chatter minimal
mp_buy_anywhere 0
mp_round_infinite 0
mp_falldamage 1
mp_footsteps 1
mp_free_armor 0
mp_auto_reload_weapons 0
mp_weapons_allow_map_placed 1
mp_item_staytime 300
mp_scoreboard_showhealth 3
mp_scoreboard_showmoney 3
mp_infinite_grenades 0

// SoccerJam raises this; put it back for every other mode
sv_maxspeed 320

// Match mode turns these off/on; put back the game's defaults for every other mode
mp_tkpunish 0
mp_autokick 1
mp_forcechasecam 0
mp_forcecamera 0

// Zombie Plague turns these on; put back the game's defaults for every other mode
mp_playerid 0
mp_flashlight 0
// nobody respawns mid-round unless a mode (or its Respawn setting) says so
mp_forcerespawn 0
// auto bunnyhop is a mode's own setting: off unless that mode (or a preset for it) turns it on
gm_autobhop 0

// Bot and fun settings shared by every mode: their defaults. Saved choices (global.cfg)
// come after this, and Reset bot and fun settings brings these back.
bot_join_team any
bot_quota_mode normal
gm_botstyle 1
gm_mood 1
gm_personality 100
gm_autodiff 0
gm_regulars 1
gm_churn 1
gm_hb_reaction 1
gm_hb_aim 1
gm_hb_mistakes 1
gm_hb_bhop 1
gm_hb_hold 1
gm_hb_habits 1
gm_hb_tilt 1
gm_hb_showoff 1
gm_hb_afk 1
gm_hb_sprays 1
gm_hb_radio 1
gm_hb_disrespect 0
gm_bf_weapons 1
gm_bf_spawn 1
gm_bf_flashlight 1
gm_bf_salute 1
gm_bf_look 1
gm_bf_celebrate 1
gm_bf_breakables 1
gm_bf_drop 1
gm_bf_bad 1
gm_bf_cheeky 1
gm_botchat_humans 1
// dead bots' chat seen by the living: -1 automatic (a dedicated server only the dead, as standard;
// a game of your own everyone), 1 everyone, 0 only the dead
gm_botchat_deadchat -1
gm_botchat_stop 1
gm_botchat_obey 1
// hot-headed dead bots now and then tell their team where an enemy is (ghosting): off
gm_botchat_ghost 0
gm_clans 1
gm_botjoin 1
gm_botvotes 1
gm_botping 1
gm_atmo_spec 1
gm_tracers 0
gm_dmgnumbers 0
gm_impacts 0
gm_nadetrail 0
