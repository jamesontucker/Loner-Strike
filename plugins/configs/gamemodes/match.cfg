// Match (5v5): competitive rules for scrims and pick-up games (gm_scrim.amxx).
// Warmup, the knife round and the round limit are run by the plugin; its own
// settings (gm_scrim_*) come from data/gamemodes/scrim.cfg, written by the app's
// Match page. Warmup changes a few cvars for a while and puts these back when live.
mp_startmoney 800
mp_roundtime 1.75
mp_freezetime 10
mp_buytime 0.25
mp_c4timer 35
mp_friendlyfire 1
mp_tkpunish 0
mp_autoteambalance 0
mp_limitteams 0
mp_autokick 0
mp_timelimit 0
mp_maxrounds 0
mp_winlimit 0
mp_forcechasecam 2
mp_forcecamera 2
// Bots play as a team: no lone wolves, no machine guns or shields, a calm buy
// (gm_scrim's bot economy decides full buys, saves and force buys)
bot_allow_rogues 0
bot_allow_machine_guns 0
bot_allow_shield 0
bot_allow_grenades 1
bot_defer_to_human 0
