; Add-ons that can be switched on in any mode from the in-game menu.
; Changes apply after a map restart (the menu offers one).
;
; id  "Name"  "plugin files (space separated)"  "Short description"  "extra options command"
; Optional: addons/<id>.ini lists in-game settings, addons/<id>.cfg holds defaults.

hook         "Grappling hook"  "csb_grappling_hook.amxx"  "Bind a key to +hook"         ""
quakesounds  "Quake sounds"    "miscstats.amxx"           "First blood, multi kill..."  "amx_statscfgmenu"
gore         "Ultimate gore"   "amx_gore_ultimate.amxx"   "Blood, gibs and splatter"    ""
dice         "Roll the Dice"   "dice_main.amxx dice_items_global.amxx dice_items_cstrike.amxx"  "Type /rtd for a random buff or curse"  ""
roundmusic   "Round-end music" "roundmusic.amxx"  "Win music, drop mp3s in sound/roundsound"  "say /music"
