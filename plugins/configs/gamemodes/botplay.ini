; How bots play together, per game mode or map. Used with a bot style (Bots > Bot style,
; anything but Classic). Each bot has its own playstyle either way: rushers, roamers,
; lurkers who go off alone, careful players who hold angles, and the odd team player.
;
;   team   some teamwork: a few team players pair up, and now and then one tags along
;          behind you; everyone else still goes their own way
;   solo   individuals (the default): hardly any grouping, nobody shadows you, a wide
;          mix of rushers and campers
;   hold   individuals who mostly play it safe: most hold an angle and wait, a few roam
;          (aim, duel and small arena maps)
;
; Takes effect from the next map: Condition Zero reads bot personalities when a map loads.
; A map rule wins over the mode's rule. Map rules end with * to match the start of the
; name, or give the whole name. Modes and maps not listed play solo.
;
; mode id or map            how

; modes (ids from modes.ini)
classic                     team
match                       team
basebuilder                 team
scoutz                      hold
awp                         hold
knife                       hold
pistols                     hold
deagle                      hold

; maps
aim_*                       hold
awp_*                       hold
scoutzknivez*               hold
scoutz_*                    hold
