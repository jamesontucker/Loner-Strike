// Last Stand (gm_laststand.amxx + gm_components.amxx): hold the base against waves.
// Everyone plays Counter-Terrorist; enemies are creatures (or knife-only zombie bots on
// servers without them). One round is one stand: the mode ends it on a win or a loss.
mp_round_infinite 1
mp_roundtime 9
mp_freezetime 3
mp_buytime -1
mp_startmoney 2000
mp_autoteambalance 0
mp_limitteams 0
mp_friendlyfire 0
mp_timelimit 0
humans_join_team CT
// no bomb or hostage goals: bots defend
gm_nobomb 1
bot_deathmatch 1
// the mode shows its own wave banners
ls_comp_wave_announce 0
// How a stand is lost, besides nobody left standing (the Game Mode Menu has these too).
// Times are for Normal: Easy x1.5, Hard x0.7, Nightmare x0.5.
//   lst_overrun      seconds two or more enemies may hold the base with no defender in it or within 350 u of it (0 = never)
//   lst_last_chance  seconds the bots get once every person is down or out (0 = bots carry on)
//   lst_lives        Nightmare only: shared lives for coming back after a held wave
//   lst_base_radius  the base's size round the CT spawn, unless the map has a component named lst_base
lst_overrun 15
lst_last_chance 30
lst_lives 5
lst_base_radius 450
// Buying: the game's buy menu works in the map's buy zones (the CT spawn on stock maps, the armory
// on maps made for Last Stand), during waves too. The armory's own shop (press USE there, or say /shop)
// sells repair kits, armour, grenades, ammo and medkits, dearer each wave.
//   lst_buy_anywhere 1   buy anywhere between waves (off: only in buy zones)
//   lst_shop_scale       prices x this
//   lst_shopkeeper       barney | gman | none: who stands at the armory (Half-Life's own models; next map)
lst_buy_anywhere 0
lst_shop_scale 1.0
lst_shopkeeper barney
