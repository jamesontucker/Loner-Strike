// Last Stand (gm_laststand.amxx + gm_components.amxx): hold the base against waves.
// Everyone plays Counter-Terrorist; enemies are creatures (or knife-only zombie bots on
// servers without them). One round is one stand: the mode ends it on a win or a loss.
mp_round_infinite 1
mp_roundtime 9
mp_freezetime 3
mp_buytime -1
mp_startmoney 2000
mp_autoteambalance 0
mp_limitteams 0
mp_friendlyfire 0
mp_timelimit 0
humans_join_team CT
// no bomb or hostage goals: bots defend
gm_nobomb 1
bot_deathmatch 1
// the mode shows its own wave banners
ls_comp_wave_announce 0
