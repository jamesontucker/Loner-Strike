// Loner-Strike: the viewer against the game (docs/TOOLS-RENDER.md, "Checking against the game").
// Copy to cstrike/ (or czero/), start a listen server on the map, then in the console:
//   exec lscompare.cfg          (once per map: cheats, no HUD, no gun, fov 90)
//   ls_<shot>                   (moves you there and takes the screenshot)
// Screenshots land in cstrike/ as <map>NNNN.bmp. Leave your video settings as they are: the
// viewer reads gamma, brightness, texgamma, lightgamma and gl_overbright from your config.cfg.

sv_cheats 1
mp_freezetime 0
mp_roundtime 9
bot_quota 0
bot_kick
hud_draw 0
r_drawviewmodel 0
crosshair 0
cl_bob 0
cl_bobup 0
cl_rollangle 0
default_fov 90
fov 90

// de_dust2: T spawn (sun, sky), then the long tunnel (indoors, dark)
alias ls_d2_spawn  "ls_cam -832 -800 176 0 10; wait; wait; wait; wait; wait; screenshot"
alias ls_d2_sky    "ls_cam -832 -800 176 -40 45; wait; wait; wait; wait; wait; screenshot"
alias ls_d2_tunnel "ls_cam -1830 1450 40 0 270; wait; wait; wait; wait; wait; screenshot"
// cs_office: indoors, T spawn; glass (render mode 2, renderamt 50)
alias ls_office    "ls_cam 1152 328 -124 0 322; wait; wait; wait; wait; wait; screenshot"
alias ls_office_glass "ls_cam -928 120 -110 0 90; wait; wait; wait; wait; wait; screenshot"
// cs_havana: additive street-light cones (render mode 5), night sky
alias ls_havana    "ls_cam -500 -1450 60 -15 270; wait; wait; wait; wait; wait; screenshot"
// cs_747: a strobe light style (4: mamama) - take two or three, the room blinks
alias ls_747_strobe "ls_cam -1440 620 440 60 270; wait; wait; wait; wait; wait; screenshot"
// de_aztec: world water (opaque, wobbling), func_water (mode 2, 100), a { fence (mode 4), a model
alias ls_az_water  "ls_cam -3300 228 -250 30 180; wait; wait; wait; wait; wait; screenshot"
alias ls_az_river  "ls_cam 515 350 -380 35 90; wait; wait; wait; wait; wait; screenshot"
alias ls_az_fence  "ls_cam -627 -1180 -440 0 270; wait; wait; wait; wait; wait; screenshot"
alias ls_az_plant  "ls_cam -3040 1000 -150 45 90; wait; wait; wait; wait; wait; screenshot"
