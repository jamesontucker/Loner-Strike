// -----------------------------------------------------------
// Zombie Plague 5.0.8 "Advanced" config (CZ setup)
// Executed by zp50_core at map start. Every cvar not listed
// here keeps the plugin default.
// -----------------------------------------------------------

// General
zp_gamemode_delay 10            // seconds before the round's mode starts
zp_prevent_consecutive_modes 1  // never the same special mode twice in a row
zp_lighting "d"                 // map darkness: a (darkest) .. z (normal)
zp_starting_ammo_packs 5
zp_deathmatch 0                 // 0 off, 1 respawn as human, 2 as zombie, 3 random, 4 balance
zp_respawn_delay 5

// Special round chances (1 in N). Infection is the normal round.
zp_multi_chance 20
zp_swarm_chance 20
zp_nemesis_chance 20
zp_assassin_enable 1
zp_assassin_chance 20
zp_survivor_chance 20
zp_sniper_chance 20
zp_plague_chance 20
zp_armageddon_chance 20

// Special rounds need this many alive players
zp_multi_min_players 0
zp_swarm_min_players 0
zp_nemesis_min_players 0
zp_assassin_min_players 0
zp_survivor_min_players 0
zp_sniper_min_players 0
zp_plague_min_players 0
zp_armageddon_min_players 0

// Sniper: AWP one-shots zombies. Health 0 = base health x alive players
zp_sniper_health 0
zp_sniper_base_health 100
zp_sniper_speed 0.95
zp_sniper_gravity 0.75

// Assassin: one-hit kill, dark round. Health 0 = base health x alive players
zp_assassin_health 0
zp_assassin_base_health 2000
zp_assassin_speed 1.05
zp_assassin_gravity 0.5

// Weapons for humans (bots always get random weapons)
zp_buy_custom_primary 1
zp_buy_custom_secondary 1
zp_give_all_grenades 1          // fire, frost and flare grenade every round
