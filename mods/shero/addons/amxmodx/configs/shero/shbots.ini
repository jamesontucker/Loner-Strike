; SuperHero Mod - how bots use heroes (read by sh_botpowers.amxx at map start;
; "sh_botconfig_reload" in the server console reloads it).
;
; "Hero name"  mode  [range] [chance] [holdmin] [holdmax]
;
; mode:
;   skip  - bots never pick this hero (humans still can)
;   aim   - press +power when an enemy is in/near the bot's crosshair within <range> units
;   near  - press +power when a visible enemy is in front of the bot within <range> units
;   any   - press +power at random moments while no enemy is around
;   never - bots may pick the hero but never press its key
; chance  - probability per second of pressing while the condition is true (0.0 - 4.0)
; holdmin/holdmax - how long the key is held, in seconds (random in between)
;
; Power heroes not listed here: mode near, range 800, chance 0.5, hold 0.2-0.6.
; Heroes without a +power key are always fine for bots (they work automatically),
; list them here only to "skip" them.

"The Hulk"       near  1000  0.6  0.1  0.2
"Spider-Man"     aim   1500  0.3  0.6  1.4
"Cyclops"        aim   2000  0.8  0.4  1.2
"Mystique"       any   0     0.1  0.2  0.3
"Green Lantern"  near  1200  0.4  0.2  0.3
"Colossus"       near  1000  0.5  0.1  0.2
"Yoda"           near  400   0.8  0.1  0.2
"Human Torch"    aim   550   0.8  0.1  0.2
"Sandman"        aim   1500  0.6  0.1  0.2
"Sub-Zero"       aim   1500  0.6  0.1  0.2
"Frieza"         aim   2000  0.5  0.8  1.5

; Not usable by bots in a sensible way:
"Iron Man"       skip    ; jetpack flight - bots would fly off ledges
"NightCrawler"   skip    ; walking through walls - bots get stuck and are auto-slain
"Bomberman"      skip    ; needs planning: plant now, detonate later
"Kamikaze"       skip    ; blows himself up after a 15 second fuse

; Pure HUD/vision powers, useless for bots:
"Daredevil"      skip
"Xavier"         skip
