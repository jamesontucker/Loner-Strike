## SuperHero levels for Condition Zero (solo with bots / small games).
## One new hero slot per level, max 10 heroes (sh_maxpowers). Heroes are level 0-9 (see shconfig.cfg).
## New players start at level 1 (sh_minlevel 1) so everyone gets a hero right away.
##
## NUMLEVELS  - The total Number of levels to award players
## XPLEVELS   - How much XP does it take to earn each level (0..NUMLEVELS)
## XPGIVEN    - How much XP is given when a Level(N) player is killed (0..NUMLEVELS)
## LTXPLEVELS - Same as XPLEVELS but for Long-Term mode (sh_savexp 1)
## LTXPGIVEN  - Same as XPGIVEN but for Long-Term mode (sh_savexp 1)
NUMLEVELS 15
XPLEVELS   0 100 200 350 550 800 1100 1450 1850 2300 2800 3350 3950 4600 5300 6050
XPGIVEN    40 50 60 70 80 90 100 110 120 130 140 150 160 170 180 190
LTXPLEVELS 0 100 250 450 700 1000 1400 1900 2500 3200 4000 5000 6200 7600 9200 11000
LTXPGIVEN  10 12 14 16 18 20 23 26 29 32 35 38 41 44 47 50
