[package]
name = "ls-intent"
# (its real version is Loner-Strike's own, like ls-control's)
version = "0.0.0"
description = "Loner-Strike's understanding helper: a loosely worded line said to the bots -> the plain command they know (Advanced Bot Interaction)"
license = "GPL-3.0"
edition = "2021"
publish = false

# not part of any workspace, and apart from ls-voice: llama.cpp and Whisper each carry their
# own ggml, which can't be linked into one program
[workspace]

[dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
