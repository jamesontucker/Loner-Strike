[package]
name = "ls-control"
# (its real version is Loner-Strike's own: build.rs reads it from app/src-tauri/Cargo.toml,
# so the app and the service on the server always agree)
version = "0.0.0"
description = "Loner-Strike's shared control service for a server on a Linux machine"
license = "GPL-3.0"
edition = "2021"
publish = false

# not part of any workspace: built on its own, for Linux (scripts/build-server-agent.sh)
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
# request heads, parsed (the listener itself is api.rs's own: it only listens on 127.0.0.1,
# behind Caddy or cloudflared, with time limits on every connection)
httparse = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
