[package]
name = "loner-strike"
version = "0.1.3"
homepage = "https://lonerstrike.com"
description = "Re-live the golden days of Counter-Strike locally or with the friends you don't have."
license = "GPL-3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
axum = "0.7"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
dirs = "5"
igd-next = "0.18"
if-addrs = "0.15"
rust-embed = { version = "8", features = ["mime-guess"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# HTTPS to GameBanana and playit.gg (same rustls + ring stack the updater already uses)
reqwest = { version = "0.13", default-features = false, features = ["blocking", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
regex = "1"
zip = { version = "9", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "webp"] }
# Setup (setup/): pinned downloads checked by sha256, unpacking .tar.gz/.tar.xz/.zip without Python
sha2 = "0.10"
sha1 = "0.10"
tar = { version = "0.4", default-features = false }
flate2 = "1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
# Linux servers (remote.rs): SSH and SFTP with bundled crypto, so ed25519 keys work on Mac and Windows alike
ssh2 = { version = "0.9", features = ["vendored-openssl", "openssl-on-win32"] }
# Server backups (backup.rs): passwords and webhooks are sealed with a key stretched from the
# user's password, so a backup file on its own never gives them away
argon2 = "0.5"
chacha20poly1305 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
