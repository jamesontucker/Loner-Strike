<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 28 456 456">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3124"/>
      <stop offset="1" stop-color="#171a12"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e7a8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f3e7a8" stop-opacity=".12"/>
    </linearGradient>
    <radialGradient id="pool" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e9dc8c"/>
      <stop offset=".7" stop-color="#c4b550"/>
      <stop offset="1" stop-color="#c4b550" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="28" y="28" width="456" height="456"/></clipPath>
  </defs>
  <rect x="28" y="28" width="456" height="456" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <!-- the spotlight -->
    <path d="M226 28 H286 L410 408 H102 Z" fill="url(#beam)"/>
    <ellipse cx="256" cy="408" rx="168" ry="40" fill="url(#pool)"/>
  </g>
  <!-- one soldier, alone in the light: hugging his knees, rifle leaning beside him -->
  <g fill="#10130d" stroke="#10130d" stroke-linecap="round" stroke-linejoin="round">
    <path d="M164 412 L196 196" stroke-width="11" fill="none"/>
    <path d="M196 196 L200 168" stroke-width="6" fill="none"/>
    <path stroke="none" d="M170 300 l16 2 l-6 40 l-15 -2 z"/>
    <path d="M226 270 C206 300 204 350 216 392" stroke-width="58" fill="none"/>
    <path d="M222 388 L296 300" stroke-width="50" fill="none"/>
    <path d="M296 300 L314 396" stroke-width="44" fill="none"/>
    <ellipse cx="326" cy="402" rx="30" ry="14" stroke="none"/>
    <path d="M236 290 L300 330" stroke-width="22" fill="none"/>
    <circle cx="262" cy="250" r="34" stroke="none"/>
    <path stroke="none" d="M222 248 C222 210 258 196 286 208 C302 216 308 232 304 246 Z"/>
  </g>
</svg>
