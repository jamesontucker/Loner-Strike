# Loner-Strike community index publisher (see src/index.js). Deploy from this folder:
#   npx wrangler@3 deploy
# bucket_name is the download bucket (the one behind dl.lonerstrike.com).
name = "lonerstrike-community-publish"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/10 * * * *"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "loner-strike"

[observability]
enabled = true
